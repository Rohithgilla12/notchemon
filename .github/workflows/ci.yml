name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          xcodebuild test \
            -project Notchemon.xcodeproj \
            -scheme Notchemon \
            -destination 'platform=macOS' \
            -derivedDataPath .build/dd

      - name: Check for bundled assets
        run: scripts/check-no-assets.sh .build/dd/Build/Products/Debug/Notchemon.app

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    env:
      P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          if [[ -n "$P12_BASE64" && -n "$P12_PASSWORD" && -n "$ASC_KEY_BASE64" && -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing or notarisation secrets are missing; skipping the signed release."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.available == 'true'

      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.secrets.outputs.available == 'true'
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        if: steps.secrets.outputs.available == 'true'
        run: brew install xcodegen

      - name: Import Developer ID certificate
        if: steps.secrets.outputs.available == 'true'
        run: |
          keychain="$RUNNER_TEMP/notchemon-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$keychain" | grep "7D2V3RM56T"

      - name: Write App Store Connect key
        if: steps.secrets.outputs.available == 'true'
        run: |
          echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarise
        if: steps.secrets.outputs.available == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: scripts/release.sh | tee "$RUNNER_TEMP/release.log"

      - name: Publish GitHub release
        if: steps.secrets.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(awk '/^sha256:/ {print $2}' "$RUNNER_TEMP/release.log")"
          gh release create "$GITHUB_REF_NAME" dist/Notchemon-*.zip \
            --title "Notchemon $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Cask sha256: $sha"

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/notchemon-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
