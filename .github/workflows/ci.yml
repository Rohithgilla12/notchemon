name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          xcodebuild test \
            -project Notchemon.xcodeproj \
            -scheme Notchemon \
            -destination 'platform=macOS' \
            -derivedDataPath .build/dd

      - name: Test release scripts
        run: scripts/test-scripts.sh

      - name: Check for bundled assets
        run: scripts/check-no-assets.sh .build/dd/Build/Products/Debug/Notchemon.app

  # Secrets are not readable in a job-level `if`, so a small job checks them
  # and the release job runs only when every one is set.
  release-secrets:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD APP_STORE_CONNECT_API_KEY_BASE64 \
            APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping the release. Missing secrets: ${missing[*]}. See docs/releasing.md."
          fi

  release:
    needs: [test, release-secrets]
    if: needs.release-secrets.outputs.ready == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check the tag matches project.yml
        run: |
          version="$(sed -nE 's/^[[:space:]]*CFBundleShortVersionString: "([^"]*)"$/\1/p' project.yml)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project.yml version $version. Run scripts/bump-version.sh first."
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*SUPublicEDKey: "[A-Za-z0-9+/]{43}="$' project.yml; then
            echo "::error::project.yml has no SUPublicEDKey. Run scripts/setup-sparkle-keys.sh and commit the change."
            exit 1
          fi
          scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/notchemon-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$keychain" | grep "7D2V3RM56T"

      - name: Write App Store Connect key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          echo "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarise, and package
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: scripts/release.sh

      - name: Generate the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/make-appcast.sh "$VERSION"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Notchemon-$VERSION.dmg" \
            "dist/Notchemon-$VERSION.zip" \
            dist/appcast.xml \
            --verify-tag \
            --title "Notchemon $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # The cask lives on main, so the release commits the new version and
      # checksum there. A push from GITHUB_TOKEN starts no new workflow run.
      - name: Update the Homebrew cask on main
        run: |
          sha="$(shasum -a 256 "dist/Notchemon-$VERSION.zip" | cut -d' ' -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B cask-update origin/main
            scripts/update-cask.sh "$VERSION" "$sha"
            if git diff --quiet; then
              echo "Casks/notchemon.rb already points at $VERSION."
              exit 0
            fi
            git commit -am "chore(cask): update notchemon to $VERSION"
            if git push origin cask-update:main; then
              exit 0
            fi
            echo "main moved during the update; retrying."
          done
          echo "::error::Could not push the cask update to main. Run scripts/update-cask.sh $VERSION $sha locally."
          exit 1

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/notchemon-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
