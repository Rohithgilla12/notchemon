name: Notchemon
options:
  bundleIdPrefix: com.rohithgilla
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # CI's older Xcode gives up on expressions this one accepts; warn well before that.
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=300"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: 7D2V3RM56T
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
targets:
  Notchemon:
    type: application
    platform: macOS
    sources:
      - Notchemon
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: Sparkle
    # The single source for the version and entitlements. XcodeGen writes
    # both files on generate, so neither is tracked.
    info:
      path: Notchemon/Info.plist
      properties:
        CFBundleDisplayName: $(NOTCHEMON_DISPLAY_NAME)
        CFBundleShortVersionString: "0.2.4"
        CFBundleVersion: "6"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT licensed. Unaffiliated fan work."
        NSLocationWhenInUseUsageDescription: "Notchemon uses your approximate location to show local weather."
        SUFeedURL: https://github.com/Rohithgilla12/notchemon/releases/latest/download/appcast.xml
        # Written by scripts/setup-sparkle-keys.sh. While empty, the app never starts the updater.
        SUPublicEDKey: "noL9XzYaGUwzw1WlGpUmIN1lKxX71p7L8itIXE/PYBk="
        # Checks the EdDSA signature before unpacking an update. Sparkle 2 otherwise
        # accepts Apple code signing alone when no EdDSA key is set.
        SUVerifyUpdateBeforeExtraction: true
    entitlements:
      path: Notchemon/Notchemon.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        # Hardened runtime, which notarised Release builds use, blocks Core
        # Location without it.
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rohithgilla.Notchemon
        NOTCHEMON_DISPLAY_NAME: Notchemon
      configs:
        # A separate bundle ID keeps a Debug build's Accessibility grant,
        # defaults domain, and Application Support folder apart from the
        # installed app's. macOS keys all three on the bundle ID.
        Debug:
          CODE_SIGN_IDENTITY: "-"
          PRODUCT_BUNDLE_IDENTIFIER: com.rohithgilla.Notchemon.debug
          NOTCHEMON_DISPLAY_NAME: Notchemon Debug
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  NotchemonTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchemonTests]
    dependencies:
      - target: Notchemon
      - package: Sparkle
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Notchemon.app/Contents/MacOS/Notchemon"
schemes:
  Notchemon:
    build:
      targets:
        Notchemon: all
        NotchemonTests: [test]
    test:
      targets: [NotchemonTests]
